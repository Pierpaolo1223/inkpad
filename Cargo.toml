[workspace]
members = ["crates/inkpad-core", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[profile.release]
# "leggerissima": binario piccolo, niente debug info in produzione.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
