[package]
name = "inkpad"
description = "Quaderno a inchiostro, locale e sincronizzabile con Git"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "inkpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
inkpad-core = { path = "../crates/inkpad-core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# iOS/Android non hanno OpenSSL di sistema: la compila openssl-sys insieme al crate.
vendored-openssl = ["inkpad-core/vendored-openssl"]
